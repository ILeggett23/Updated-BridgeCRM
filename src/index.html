<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f2ec" />
    <meta name="bridge-cloud-state" content="disabled" />
    <meta name="bridge-hosted-push" content="enabled" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bridge" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Bridge CRM for prospecting, relationships, follow-ups, and pipeline tracking." />
    <script>
      (() => {
        if (!("serviceWorker" in navigator) || location.protocol !== "https:") return;
        const registerCurrentWorker = () => setTimeout(
          () => navigator.serviceWorker.register("./sw.js?v=1.3.27").catch(() => {}),
          1000
        );
        if (document.readyState === "complete") registerCurrentWorker();
        else window.addEventListener("load", registerCurrentWorker, { once: true });
      })();
    </script>
    <title>Bridge CRM</title>
    <link rel="manifest" href="./manifest.webmanifest?v=1.3.27" />
    <link rel="icon" type="image/png" sizes="192x192" href="./bridge-icon-192.png?v=1.3.27" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=1.3.27" />
    <link rel="preload" href="./fonts/inter-tight-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles.css?v=1.3.27" data-bridge-styles />
  </head>
  <body>
    <div id="app"><div class="boot"><img class="brand-mark boot__icon" src="./bridge-icon-192.png?v=1.3.27" alt="" /><strong>Bridge</strong><span>Relationships that move forward</span></div></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script src="./config.js?v=1.3.27"></script>
    <script src="./contact-logic.js?v=1.3.27"></script>
    <script src="./engagement-logic.js?v=1.3.27"></script>
    <script src="./communication-logic.js?v=1.3.27"></script>
    <script src="./analytics-logic.js?v=1.3.27"></script>
    <script src="./relationship-health-logic.js?v=1.3.27"></script>
    <script src="./network-logic.js?v=1.3.27"></script>
    <script src="./scorecard-logic.js?v=1.3.27"></script>
    <script src="./release-logic.js?v=1.3.27"></script>
    <script src="./account-client.js?v=1.3.27"></script>
    <script type="module" src="./app.js?v=1.3.27" data-bridge-app></script>
  </body>
</html>
